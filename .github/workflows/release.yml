name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release as if this branch was merged (e.g. fix/manual, feature/manual, major/manual)
        required: true
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # The merged PR's branch prefix picks the version: see scripts/next-version.sh. Other prefixes do not release.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ inputs.bump }}
        run: |
          if git ls-remote --tags origin 'v*' | grep -q "^$GITHUB_SHA"; then
            echo "::notice::$GITHUB_SHA is already released"; exit 0
          fi
          branch=${MANUAL:-$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // empty')}
          last=$(gh release list --exclude-drafts --limit 200 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          version=$(bash scripts/next-version.sh "$branch" "${last:-v0.0.0}")
          if [ -z "$version" ]; then echo "::notice::branch '$branch' does not release"; exit 0; fi
          echo "::notice::$branch: ${last:-none} -> v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  bash:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check.sh
      - run: for f in bin/ai lib/*.sh plugins/*.sh; do bash -n "$f"; done
  rust:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
  build:
    needs: [plan, bash, rust]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }   # arm runner cross-builds x86_64
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # main is protected, so the version is not committed back: the binary gets it here
      - name: Set version
        shell: bash
        run: perl -pi -e '$d ||= s/^version *=.*/version = "${{ needs.plan.outputs.version }}"/' tui/Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: tui
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -C tui/target/${{ matrix.target }}/release -czf dist/ai-launcher-${{ matrix.target }}.tar.gz ai-launcher
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive tui/target/${{ matrix.target }}/release/ai-launcher.exe dist/ai-launcher-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-launcher-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
  # a release made with GITHUB_TOKEN does not fire the "release: published" event, so call npm-publish here
  npm:
    needs: [plan, release]
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: v${{ needs.plan.outputs.version }}
    secrets: inherit
